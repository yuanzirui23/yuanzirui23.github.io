<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多人联机聊天室</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: "微软雅黑";}
        body {background: #f5f5f5; max-width: 550px; margin: 20px auto; padding: 0 10px;}
        .top {padding: 10px; background: #2481f6; color: #fff; border-radius: 8px 8px 0 0; text-align: center;}
        .chat {height: 480px; background: #fff; padding: 15px; overflow-y: auto; border: 1px solid #eee;}
        .msg {margin: 8px 0; max-width: 70%; line-height: 1.5; padding: 8px 12px; border-radius: 12px;}
        .left {background: #f1f1f1; text-align: left;}
        .right {background: #2481f6; color: #fff; margin-left: auto; text-align: right;}
        .send-box {display: flex; gap: 8px; margin-top: 10px;}
        #name {width: 120px; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none;}
        #input {flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none;}
        button {padding: 10px 20px; background: #2481f6; color: #fff; border: none; border-radius: 20px; cursor: pointer;}
    </style>
</head>
<body>
    <div class="top">多人联机聊天室</div>
    <div class="chat" id="chatBox"></div>
    <div class="send-box">
        <input type="text" id="name" placeholder="你的昵称" value="游客">
        <input type="text" id="input" placeholder="输入消息，回车发送">
        <button onclick="sendMsg()">发送</button>
    </div>

<script>
const url = "https://api.vvhan.com/api/chatroom";
let chatBox = document.getElementById("chatBox");
let input = document.getElementById("input");

// 拉取最新消息
function getMsg() {
    fetch(url)
    .then(res => res.json())
    .then(data => {
        chatBox.innerHTML = "";
        data.forEach(item => {
            let div = document.createElement("div");
            div.className = "msg left";
            div.innerText = `${item.name}：${item.text}`;
            chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    })
}

// 发送消息
function sendMsg() {
    let name = document.getElementById("name").value.trim() || "游客";
    let text = input.value.trim();
    if(!text) return;
    fetch(`${url}?name=${encodeURIComponent(name)}&text=${encodeURIComponent(text)}`);
    input.value = "";
}

// 回车发送
input.addEventListener("keydown", e => {
    if(e.key === "Enter") sendMsg();
});

// 定时刷新消息，实现联机
getMsg();
setInterval(getMsg, 2000);
</script>
</body>
</html>
