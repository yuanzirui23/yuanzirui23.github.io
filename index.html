<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>聊天</title>
    <style>
        body { max-width: 500px; margin: 20px auto; background: #eee; }
        #chat { height: 500px; background: white; padding: 15px; border-radius: 10px; overflow-y: auto; }
        .msg { background: #0084ff; color: white; padding: 8px 12px; border-radius: 15px; margin: 5px 0; max-width: 70%; }
        .input { display: flex; margin-top: 10px; gap: 5px; }
        input { flex:1; padding:12px; border-radius:20px; border:1px solid #ccc; }
        button { padding:12px 18px; background:#0084ff; color:white; border:none; border-radius:20px; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input">
        <input id="msg" placeholder="输入消息">
        <button onclick="send()">发送</button>
    </div>

<script>
function showMsg() {
    let list = JSON.parse(localStorage.getItem("chat") || "[]");
    let html = "";
    list.forEach(m => {
        html += `<div class="msg">${m}</div>`;
    });
    document.getElementById("chat").innerHTML = html;
}

function send() {
    let txt = document.getElementById("msg").value.trim();
    if(!txt) return;
    let list = JSON.parse(localStorage.getItem("chat") || "[]");
    list.push(txt);
    localStorage.setItem("chat", JSON.stringify(list));
    document.getElementById("msg").value = "";
}

setInterval(showMsg, 500);
</script>
</body>
</html>
