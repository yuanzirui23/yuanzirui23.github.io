<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>本地聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑";
        }
        body {
            background: #f0f2f5;
            max-width: 500px;
            margin: 20px auto;
            padding: 10px;
        }
        .chat {
            background: #fff;
            height: 500px;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .msg {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 15px;
            margin: 6px 0;
        }
        .my {
            background: #0084ff;
            color: #fff;
            margin-left: auto;
        }
        .other {
            background: #e4e6eb;
            color: #333;
        }
        .box {
            display: flex;
            gap: 6px;
        }
        #name {
            width: 80px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
        }
        #content {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
        }
        button {
            padding: 10px 16px;
            background: #0084ff;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat" id="chatBox"></div>
    <div class="box">
        <input id="name" placeholder="昵称" value="用户">
        <input id="content" placeholder="输入消息">
        <button onclick="sendMsg()">发送</button>
    </div>

<script>
// 用浏览器本地存储共享消息，同电脑多窗口互通
function getMsgList() {
    let data = localStorage.getItem("chatData");
    return data ? JSON.parse(data) : [];
}
function saveMsgList(list) {
    localStorage.setItem("chatData", JSON.stringify(list));
}

// 渲染消息
function render() {
    let list = getMsgList();
    let html = "";
    let myName = document.getElementById("name").value;
    list.forEach(item => {
        if(item.name === myName) {
            html += `<div class="msg my">${item.name}：${item.text}</div>`;
        } else {
            html += `<div class="msg other">${item.name}：${item.text}</div>`;
        }
    });
    let box = document.getElementById("chatBox");
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
}

// 发送消息
function sendMsg() {
    let name = document.getElementById("name").value.trim();
    let text = document.getElementById("content").value.trim();
    if(!name || !text) return;

    let list = getMsgList();
    list.push({name, text});
    saveMsgList(list);
    document.getElementById("content").value = "";
    render();
}

// 监听页面可见，自动刷新消息
document.addEventListener("visibilitychange", render);
// 初始加载
render();
</script>
</body>
</html>
